{% extends "base.html" %}


{% block title %}
Configurações
{% endblock %}



{% block css %}

<link rel="stylesheet"
href="{{ url_for('static', filename='css/dashboard.css') }}">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/configuracoes.css') }}">

{% endblock %}





{% block page_content %}



<div class="config-container">



    <div class="config-header">

        <h1>
            <i class="bi bi-gear"></i>
            Configurações
        </h1>

        <p>
            Gerencie os dados da sua farmácia e sua senha.
        </p>

    </div>





    <div class="config-grid">





        <!-- =========================
             DADOS CADASTRAIS
        ========================== -->


        <div class="config-card">


            <h2>
                Dados cadastrais
            </h2>




            <form method="POST"
            action="{{ url_for('dashboard.atualizar_dados') }}">





                <div class="form-group">


                    <label>
                        Nome da Farmácia
                    </label>


                    <input
                    type="text"
                    value="{{ usuario.nome }}"
                    class="form-control"
                    readonly>


                </div>






                <div class="form-group">


                    <label>
                        CNPJ
                    </label>


                    <input
                    type="text"
                    value="{{ usuario.cnpj }}"
                    class="form-control"
                    disabled>


                </div>







                <div class="form-group">


                    <label>
                        WhatsApp
                    </label>


                    <input
                    type="text"
                    name="telefone"
                    value="{{ usuario.telefone or '' }}"
                    class="form-control"
                    placeholder="DDD + número">


                </div>







                <div class="form-group">


                    <label>
                        E-mail
                    </label>


                    <input
                    type="email"
                    name="email"
                    value="{{ usuario.email }}"
                    class="form-control"
                    placeholder="email@empresa.com">


                </div>






                <button
                class="btn-save"
                type="submit">


                    Salvar alterações


                </button>





            </form>



        </div>









        <!-- =========================
             ALTERAR SENHA
        ========================== -->


        <div class="config-card">



            <h2>
                Alterar senha
            </h2>






            <form method="POST"
            action="{{ url_for('dashboard.alterar_senha') }}">






                <div class="form-group">


                    <label>
                        Senha atual
                    </label>


                    <input
                    type="password"
                    name="senha_atual"
                    class="form-control"
                    placeholder="Digite sua senha atual">


                </div>








                <div class="form-group">


                    <label>
                        Nova senha
                    </label>


                    <input
                    type="password"
                    name="nova_senha"
                    class="form-control"
                    placeholder="Digite a nova senha">


                </div>








                <div class="form-group">


                    <label>
                        Confirmar nova senha
                    </label>


                    <input
                    type="password"
                    name="confirmar_senha"
                    class="form-control"
                    placeholder="Repita a nova senha">


                </div>







                <button
                class="btn-save"
                type="submit">


                    Alterar senha


                </button>






            </form>





        </div>





    </div>





</div>





{% endblock %}
